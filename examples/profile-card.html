<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #eee; font-family: Arial, sans-serif; }
    .profile-card {
      background: #16213e; border-radius: 16px; padding: 32px;
      max-width: 360px; margin: 80px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      text-align: center;
    }
    .avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: #e94560; margin: 0 auto 16px;
    }
    h2 { font-size: 22px; margin-bottom: 4px; }
    .title { color: #aaa; font-size: 14px; margin-bottom: 20px; }
    .bio { font-size: 14px; color: #ccc; line-height: 1.5; margin-bottom: 24px; }
    .stats {
      display: flex; justify-content: center; gap: 24px; margin-bottom: 24px;
    }
    .stat-value { font-size: 20px; font-weight: bold; }
    .stat-label { font-size: 12px; color: #aaa; margin-top: 2px; }
    .follow-btn {
      width: 100%; padding: 12px; background: #e94560; color: #fff;
      border: none; border-radius: 8px; font-size: 16px; cursor: pointer;
    }
    .follow-btn:hover { background: #c73650; }
    .link { margin-top: 16px; }
    .link a { color: #e94560; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="avatar"></div>
    <h2>Alex Chen</h2>
    <div class="title">Senior Designer</div>
    <div class="bio">Passionate about design systems and accessible interfaces. Building products that work for everyone.</div>
    <div class="stats">
      <div>
        <div class="stat-value">342</div>
        <div class="stat-label">Posts</div>
      </div>
      <div>
        <div class="stat-value">12.8K</div>
        <div class="stat-label">Followers</div>
      </div>
      <div>
        <div class="stat-value">158</div>
        <div class="stat-label">Following</div>
      </div>
    </div>
    <button class="follow-btn">Follow</button>
    <div class="link">
      <a href="/profile">View Profile</a>
    </div>
  </div>
</body>
</html>

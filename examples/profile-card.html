<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    :root {
      --ds-color-bg: oklch(97% 0.012 80);
      --ds-color-surface: oklch(99% 0.005 80);
      --ds-color-surface-raised: oklch(100% 0 0);
      --ds-color-border: oklch(89% 0.012 80);
      --ds-color-fg: oklch(20% 0.02 60);
      --ds-color-fg-muted: oklch(50% 0.02 60);
      --ds-color-accent: oklch(52% 0.08 115);
      --ds-color-accent-hover: oklch(45% 0.08 115);
    }
    [data-theme="dark"] {
      --ds-color-bg: oklch(15% 0.008 75);
      --ds-color-surface: oklch(20% 0.008 75);
      --ds-color-surface-raised: oklch(25% 0.008 75);
      --ds-color-border: oklch(30% 0.008 75);
      --ds-color-fg: oklch(84% 0.008 72);
      --ds-color-fg-muted: oklch(60% 0.008 72);
      --ds-color-accent: oklch(57% 0.065 115);
      --ds-color-accent-hover: oklch(50% 0.065 115);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--ds-color-bg);
      color: var(--ds-color-fg);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }
    .profile-card {
      background: var(--ds-color-surface);
      border-radius: var(--ds-radius-xl, 12px);
      padding: var(--ds-space-8, 32px);
      max-width: 360px;
      margin: var(--ds-space-20, 80px) auto;
      box-shadow: var(--ds-shadow-md, 0 4px 20px rgba(0,0,0,0.2));
      text-align: center;
    }
    .avatar {
      width: 80px; height: 80px; border-radius: var(--ds-radius-round, 50%);
      background: var(--ds-color-accent); margin: 0 auto var(--ds-space-4, 16px);
    }
    h2 { font-size: var(--ds-text-xl, 22px); margin-bottom: var(--ds-space-1, 4px); }
    .title { color: var(--ds-color-fg-muted); font-size: var(--ds-text-sm, 14px); margin-bottom: var(--ds-space-5, 20px); }
    .bio { font-size: var(--ds-text-sm, 14px); color: var(--ds-color-fg-muted); line-height: 1.5; margin-bottom: var(--ds-space-6, 24px); }
    .stats {
      display: flex; justify-content: center; gap: var(--ds-space-6, 24px);
      margin-bottom: var(--ds-space-6, 24px);
    }
    .stat-value { font-size: var(--ds-text-lg, 20px); font-weight: bold; }
    .stat-label { font-size: var(--ds-text-xs, 12px); color: var(--ds-color-fg-muted); margin-top: var(--ds-space-0_5, 2px); }
    .follow-btn {
      width: 100%; padding: var(--ds-space-3, 12px); background: var(--ds-color-accent); color: var(--ds-color-surface-raised);
      border: none; border-radius: var(--ds-radius-md, 8px); font-size: var(--ds-text-base, 16px); cursor: pointer;
    }
    .follow-btn:hover { background: var(--ds-color-accent-hover); }
    .link { margin-top: var(--ds-space-4, 16px); }
    .link a { color: var(--ds-color-accent); text-decoration: none; font-size: var(--ds-text-sm, 14px); }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="avatar" role="img" aria-label="Alex Chen's avatar"></div>
    <h2>Alex Chen</h2>
    <div class="title">Senior Designer</div>
    <div class="bio">Passionate about design systems and accessible interfaces. Building products that work for everyone.</div>
    <div class="stats">
      <div>
        <div class="stat-value">342</div>
        <div class="stat-label">Posts</div>
      </div>
      <div>
        <div class="stat-value">12.8K</div>
        <div class="stat-label">Followers</div>
      </div>
      <div>
        <div class="stat-value">158</div>
        <div class="stat-label">Following</div>
      </div>
    </div>
    <button class="follow-btn">Follow</button>
    <div class="link">
      <a href="/profile">View Profile</a>
    </div>
  </div>
</body>
</html>
